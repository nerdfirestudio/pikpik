# build.conf — per-tree build settings, sourced by build_mac.sh, build_ios.sh
# and bundle_mac.sh from the repository root.
#
# Edit this rather than the scripts; the scripts are shared verbatim with the
# tree this port is developed in, and local edits to them are churn.

# The application's own name. It is the CMake target, the built executable, the
# macOS bundle, and the user-data directory under ~/Library/Application Support.
# It is deliberately NOT the name of the game — see docs/LEGAL.md section 6.
# Changing it moves where your saves live.
APP_NAME=pikpik
APP_ID=local.pikpik.app

# The Xcode shell project lives in app/ here, not in a directory named after
# the app the way the development tree has it.
XCODE_DIR=app

# Where the decompiled game source lives. setup.sh fetches it here; it is not
# part of this repository. Absolute, because CMake is not run from this
# directory on every path.
PC_CMAKE_ARGS="-DPIKMIN_DECOMP_DIR=$REPO_DIR/vendor/pikmin"
